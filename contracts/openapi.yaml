          type:
            - string
            - "null"
          format: date-time

    TestSeedReviewCardItem:
      type: object
      required:
        - front_prompt
        - back_summary
        - next_review_at
      properties:
        card_id:
          type: string
        learning_id:
          type: string
        category:
          $ref: "#/components/schemas/SkillCategory"
        front_prompt:
          type: string
        back_summary:
          type: string
        repetition_count:
          type: integer
          minimum: 0
          default: 0
        interval_days:
          type: integer
          minimum: 1
          default: 1
        ease_factor:
          type: number
          minimum: 1.3
          default: 2.5
        next_review_at:
          type: string
          format: date-time
        last_grade:
          type:
            - integer
            - "null"
        graded_at:
          type:
            - string
            - "null"
          format: date-time

    TestSeedRequest:
      type: object
      properties:
        reset_first:
          type: boolean
          default: true
        now:
          type: string
          format: date-time
        streak_days:
          type: integer
          minimum: 0
          default: 0
        last_study_date:
          type:
            - string
            - "null"
          format: date
        category_xp:
          type: object
          additionalProperties:
            type: integer
