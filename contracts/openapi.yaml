  /api/v1/skills/summary:
    get:
      operationId: getSkillsSummary
      tags:
        - skills
      summary: 6領域スキルツリーと成長サマリーの取得
      description: |
        対応受け入れ条件：AC-5, AC-6
        認証：不要

        固定6領域（`architecture`, `backend`, `data`, `reliability`, `security`, `trend`）ごとの
        累計XP（`total_xp`）、現在レベル（`level = floor(total_xp / 100) + 1`）、
        次レベルまでの残りXP（`xp_to_next_level = 100 - (total_xp % 100)`）、および
        全体の `total_xp`、`overall_level`、`streak_days`、`weekly_mastered_count` を 1秒（1,000ms）以内に返す。
        - データ0件時（AC-6）は6領域すべて `total_xp: 0`, `level: 1`, `xp_to_next_level: 100`、全体 `total_xp: 0`, `overall_level: 1`, `streak_days: 0`, `weekly_mastered_count: 0` を返す。
        - 注記：PRD AC-5 本文の誤記（`` `weekly_ mastered_count` ``）を修正し、正式フィールド名はスペースなしの `weekly_mastered_count` とする。

        ### 式と集計の決まり（AC-5 / AC-6、2026-10-30 追補）
        - 全体の `total_xp` は6領域の `total_xp` の合計。`overall_level = floor(total_xp / 100) + 1`（全体の `total_xp` に領域と同じ式を使う。例：285 → 3、0 → 1）。
        - `streak_days`：保存している連続日数を、`last_study_date` が今日・昨日・今日より後（基準時刻の UTC の暦日で比べる）のときだけそのまま返す。
          2日以上前か `null` なら `0` を返す（連続が切れているため。保存している値は変えず、次に完了したときに `submitChallenge` の決まりで `1` になる）。
        - `weekly_mastered_count`：基準時刻を `now` として、`now - 604,800秒（168時間）<= t <= now` に入るものを数える（両端を含む。暦日では区切らない）。
          数えるのは「`status: completed` で `completed_at` が範囲に入る問題の数」と「最後の評価 `last_grade >= 3` で `graded_at` が範囲に入るカードの数」の合計。
          カードは最後の評価だけを持つため、同じカードは1回まで数え、範囲の中で後から 1 か 2 を付けたカードは数えない。
      security: []
      parameters:
        - $ref: "#/components/parameters/TestNowHeader"
      responses:
        "200":
          description: 6領域スキルツリー・成長サマリー（AC-5 通常系 / AC-6 空状態）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillsSummaryResponse"
              examples:
                activeSummary:
                  summary: AC-5 学習実績ありのスキルサマリー
                  value:
                    categories:
