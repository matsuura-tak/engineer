  /api/v1/reviews/{card_id}/grade:
    post:
      operationId: gradeReviewCard
      tags:
        - reviews
      summary: SM-2忘却曲線カードの4段階想起評価による次回予定日と間隔の更新
      description: |
        対応受け入れ条件：AC-4, AC-7
        認証：不要

        復習カード（`card_id`）に対する4段階評価 `grade`（`1`〜`4`）を受け取り、1秒（1,000ms）以内に
        SM-2 アルゴリズムで次回間隔を更新し、`earned_xp: 10` を加算して HTTP 200 を返す。

        ### SM-2 4段階評価（`grade: 1..4`）の厳密な計算式と端数丸め規則
        評価前のカード状態を `rep = repetition_count`, `ivl = interval_days`, `ef = ease_factor`（初期値 `2.5`、下限 `1.3`）とし、
        端数丸め関数 `round_half_up(x) = floor(x + 0.5)`（正数の四捨五入）を用いる：
        - **`grade = 1`（忘れた：1日後）**：
          - `new_rep = 0`
          - `new_ivl = 1`
          - `new_ef = max(1.3, round(ef - 0.20, 2))`
        - **`grade = 2`（曖昧：現在間隔×1.2）**：
          - `new_rep = rep + 1`
          - `new_ivl = max(1, round_half_up(ivl * 1.2))`
          - `new_ef = max(1.3, round(ef - 0.15, 2))`
        - **`grade = 3`（思い出せた：SM-2標準間隔）**：
          - `new_rep = rep + 1`
          - `sm2_base_ivl` は、`new_rep == 1`（評価前 `rep == 0`）のとき `1`、`new_rep == 2`（評価前 `rep == 1`）のとき `6`、
            `new_rep >= 3`（評価前 `rep >= 2`）のとき `max(1, round_half_up(ivl * ef))`
          - `new_ivl = sm2_base_ivl`
          - `new_ef = max(1.3, round(ef, 2))`（変更なし）
        - **`grade = 4`（即答できた：SM-2標準間隔×1.3）**：
          - `new_rep = rep + 1`
          - `sm2_base_ivl`（`new_rep == 1` で `1`、`new_rep == 2` で `6`、`new_rep >= 3` で `ivl * ef`）に対し `1.3` を乗じて四捨五入：
            `new_ivl = max(1, round_half_up(sm2_base_ivl * 1.3))`（例：評価前 `rep == 1` のとき `round_half_up(6 * 1.3) = 8`）
          - `new_ef = max(1.3, round(ef + 0.10, 2))`
        - **次回予定日時 `next_review_at`**：基準時刻（`X-Test-Now` または現在UTC時刻）＋ `new_ivl` 日（`new_ivl * 86400` 秒）の ISO8601 日時。
      security: []
      parameters:
        - name: card_id
          in: path
          required: true
          description: 評価対象の復習カードID
          schema:
            type: string
            example: crd_01J8X001
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - $ref: "#/components/parameters/TestNowHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GradeReviewRequest"
            examples:
              gradeThree:
                summary: AC-4 思い出せた（grade=3）
                value:
                  grade: 3
                  elapsed_seconds: 15
              gradeOne:
                summary: AC-4 忘れた（grade=1）
                value:
                  grade: 1
                  elapsed_seconds: 20
      responses:
        "200":
          description: 復習カードの評価更新成功（AC-4）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GradeReviewResponse"
              examples:
                gradedThreeFromRepOne:
                  summary: AC-4 grade=3（rep 1 -> 2, interval 1 -> 6, +10 XP）
                  value:
                    card_id: crd_01J8X001
                    category: data
                    grade: 3
                    repetition_count: 2
                    interval_days: 6
                    ease_factor: 2.5
                    next_review_at: "2026-11-05T09:00:00Z"
                    earned_xp: 10
                    total_xp: 75
                    level: 1
                    streak_days: 1
                    remaining_due_count: 0
                gradedOneReset:
                  summary: AC-4 grade=1（rep -> 0, interval -> 1, +10 XP）
                  value:
                    card_id: crd_01J8X001
                    category: data
                    grade: 1
                    repetition_count: 0
                    interval_days: 1
                    ease_factor: 2.3
                    next_review_at: "2026-10-31T09:00:00Z"
                    earned_xp: 10
                    total_xp: 75
                    level: 1
                    streak_days: 1
                    remaining_due_count: 0
        "400":
          description: 不正な評価値（grade が 1〜4 以外）に対するバリデーションエラー（AC-7）
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                invalidGrade:
                  summary: AC-7 grade範囲外エラー（grade=0 または 5）
                  value:
                    type: https://devforge.local/problems/validation-error
                    title: 入力内容に誤りがあります
                    status: 400
                    detail: grade は 1 から 4 の整数で指定してください
                    instance: /api/v1/reviews/crd_01J8X001/grade
                    error:
                      code: VALIDATION_ERROR
                      message: grade は 1 から 4 の整数で指定してください
                      field: grade
        "404":
          description: 指定された card_id が存在しない
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                cardNotFound:
                  summary: カード未検出エラー
                  value:
                    type: https://devforge.local/problems/resource-not-found
                    title: 対象のデータが見つかりません
                    status: 404
                    detail: 指定された card_id は存在しません
                    instance: /api/v1/reviews/crd_unknown/grade
                    error:
                      code: RESOURCE_NOT_FOUND
                      message: 指定された card_id は存在しません
                      field: card_id

