      required:
        - type
        - title
        - status
        - detail
        - error
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        error:
          $ref: "#/components/schemas/ErrorDetailObject"
