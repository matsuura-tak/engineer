components:
  parameters:
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: 二重作成・二重送信防止用の冪等キー（1〜128文字の任意文字列またはUUID）
      schema:
        type: string
        minLength: 1
        maxLength: 128
        example: idem-001-20261030-01
    TestNowHeader:
      name: X-Test-Now
      in: header
      required: false
      description: |
        テスト用現在時刻注入ヘッダ（Test Seam #2：Clock Injection）。
        ISO 8601 日時（例：`2026-10-30T09:00:00Z`）を指定すると、サーバー内の期限到来判定・次回予定日算出・連続日数・直近7日間集計の基準時刻として使用する。
      schema:
        type: string
        format: date-time
        example: "2026-10-30T09:00:00Z"
    TestUrlFetchModeHeader:
      name: X-Test-Url-Fetch-Mode
      in: header
      required: false
      description: |
        テスト用外部URL取得スタブ制御ヘッダ（Test Seam #3：URL Fetcher Seam）。
        SSRF検証（AC-9）を通過した後の外部HTTP取得挙動をテスト環境で決定論的に制御する：
        - `live`（既定）：通常の外部HTTP取得（タイムアウト2.0秒、最大512KB、および `*.example.test` 予約テストドメイン判定）
        - `stub_ok`：外部通信を行わず即座に正常取得（`url_fetch_status: "fetched"`）として処理
        - `stub_timeout`：2秒タイムアウト発生をシミュレートし `url_fetch_status: "fallback_used"` でフォールバック生成（AC-8）
        - `stub_error`：接続失敗/HTTP 500 をシミュレートし `url_fetch_status: "fallback_used"` でフォールバック生成（AC-8）
      schema:
        type: string
        enum:
          - live
          - stub_ok
          - stub_timeout
          - stub_error
        default: live

  schemas:
    SkillCategory:
      type: string
      description: |
        固定6領域のスキルカテゴリ識別子。
        古いクライアントが将来の追加値を受信した場合は `unknown`（その他領域）として安全にフォールバック表示する。
      enum:
        - architecture
        - backend
        - data
        - reliability
        - security
        - trend

    UrlFetchStatus:
      type: string
      description: 外部URL取得の結果状態（`fetched`: 取得成功, `not_provided`: URL未指定, `fallback_used`: 失敗/タイムアウトによりメモ本文のみで生成）
      enum:
        - fetched
        - not_provided
        - fallback_used

    RubricPerspective:
      type: string
      description: 実践思考問題の3つの評価観点識別子
      enum:
        - premise_constraints
        - tradeoff_comparison
        - failure_edge_cases

    RubricItem:
      type: object
      required:
        - index
        - perspective
        - label_ja
        - description_ja
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 2
        perspective:
          $ref: "#/components/schemas/RubricPerspective"
        label_ja:
          type: string
        description_ja:
          type: string

    ChallengeItem:
      type: object
      required:
        - challenge_id
        - learning_id
        - category
        - question
        - rubric_items
        - status
        - created_at
      properties:
        challenge_id:
          type: string
        learning_id:
          type: string
        category:
          $ref: "#/components/schemas/SkillCategory"
        question:
          type: string
        rubric_items:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/RubricItem"
        status:
          type: string
          enum:
            - pending
            - completed
        created_at:
          type: string
          format: date-time

    ReviewCardItem:
      type: object
      required:
        - card_id
        - learning_id
        - category
        - front_prompt
        - back_summary
        - interval_days
        - ease_factor
        - repetition_count
        - next_review_at
      properties:
        card_id:
          type: string
        learning_id:
          type: string
        category:
          $ref: "#/components/schemas/SkillCategory"
        front_prompt:
          type: string
        back_summary:
          type: string
        interval_days:
          type: integer
          minimum: 1
        ease_factor:
          type: number
          minimum: 1.3
        repetition_count:
          type: integer
          minimum: 0
        next_review_at:
          type: string
          format: date-time

    CreateLearningRequest:
      type: object
      required:
        - memo
      properties:
        title:
          type:
            - string
            - "null"
          maxLength: 200
          description: 学習タイトル（省略時はメモ先頭または取得URLタイトルから自動補完）
        url:
          type:
            - string
            - "null"
          maxLength: 2048
          description: 参照した公開Web記事URL（`http://` または `https://` のみ。ローカルホスト・プライベートIPはAC-9により拒否）
        memo:
          type: string
          minLength: 10
          maxLength: 2000
          description: 学習メモ本文（10文字以上2,000文字以下必須）
        category:
          oneOf:
            - $ref: "#/components/schemas/SkillCategory"
            - type: "null"
          description: スキル領域（省略または `null` の場合はキーワード辞書により6領域のいずれかへ自動分類）

    CreateLearningResponse:
      type: object
      required:
        - learning_id
        - title
        - url
        - memo
        - category
        - earned_xp
        - url_fetch_status
        - processing_ms
        - challenge
        - review_card
        - created_at
      properties:
        learning_id:
          type: string
        title:
          type: string
        url:
          type:
            - string
            - "null"
        memo:
          type: string
        category:
          $ref: "#/components/schemas/SkillCategory"
        earned_xp:
          type: integer
          enum:
            - 15
        url_fetch_status:
          $ref: "#/components/schemas/UrlFetchStatus"
        processing_ms:
          type: integer
          minimum: 0
        challenge:
          $ref: "#/components/schemas/ChallengeItem"
        review_card:
          $ref: "#/components/schemas/ReviewCardItem"
        created_at:
          type: string
          format: date-time

    TodaySessionResponse:
      type: object
      required:
        - session_date
        - active_challenge
        - due_reviews
        - total_due_count
        - total_session_items
        - estimated_seconds
        - session_label_ja
        - is_empty
      properties:
        session_date:
          type: string
          format: date
        active_challenge:
          oneOf:
            - $ref: "#/components/schemas/ChallengeItem"
            - type: "null"
        due_reviews:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/ReviewCardItem"
        total_due_count:
          type: integer
          minimum: 0
        total_session_items:
          type: integer
          minimum: 0
          maximum: 6
        estimated_seconds:
          type: integer
          minimum: 0
          maximum: 180
        session_label_ja:
          type: string
        is_empty:
          type: boolean

    SubmitChallengeRequest:
      type: object
      required:
        - answer
        - matched_rubric_count
      properties:
        answer:
          type: string
          minLength: 10
          maxLength: 2000
          description: 実践思考問題への記述回答（10文字以上2,000文字以下）
        matched_rubric_count:
          type: integer
          minimum: 0
          maximum: 3
          description: 3つの評価観点のうち自己検証で満たした項目数（0〜3）
        elapsed_seconds:
          type: integer
          minimum: 0
          default: 60

    SubmitChallengeResponse:
      type: object
      required:
        - challenge_id
        - status
        - category
        - answer
        - matched_rubric_count
        - earned_xp
        - total_xp
        - level
        - streak_days
        - model_points
        - completed_at
      properties:
        challenge_id:
          type: string
        status:
          type: string
          enum:
            - completed
        category:
          $ref: "#/components/schemas/SkillCategory"
        answer:
          type: string
        matched_rubric_count:
          type: integer
          minimum: 0
          maximum: 3
        earned_xp:
          type: integer
          minimum: 20
          maximum: 50
          description: 基本20 XP + matched_rubric_count * 10 XP（20, 30, 40, 50 のいずれか）
        total_xp:
          type: integer
          minimum: 0
        level:
          type: integer
          minimum: 1
        streak_days:
          type: integer
          minimum: 1
        model_points:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: string
        completed_at:
          type: string
          format: date-time

    GradeReviewRequest:
      type: object
      required:
        - grade
      properties:
        grade:
          type: integer
          minimum: 1
          maximum: 4
          description: "4段階想起評価（1: 忘れた, 2: 曖昧, 3: 思い出せた, 4: 即答できた）"
        elapsed_seconds:
          type: integer
          minimum: 0
          default: 20

    GradeReviewResponse:
      type: object
      required:
        - card_id
        - category
        - grade
        - repetition_count
        - interval_days
        - ease_factor
        - next_review_at
        - earned_xp
        - total_xp
        - level
        - streak_days
        - remaining_due_count
      properties:
        card_id:
          type: string
        category:
          $ref: "#/components/schemas/SkillCategory"
        grade:
          type: integer
          minimum: 1
          maximum: 4
        repetition_count:
          type: integer
          minimum: 0
        interval_days:
          type: integer
          minimum: 1
        ease_factor:
          type: number
          minimum: 1.3
        next_review_at:
          type: string
          format: date-time
        earned_xp:
          type: integer
          enum:
            - 10
        total_xp:
          type: integer
          minimum: 0
        level:
          type: integer
          minimum: 1
        streak_days:
          type: integer
          minimum: 1
        remaining_due_count:
          type: integer
          minimum: 0

    CategorySkillSummary:
      type: object
      required:
        - category
        - label_ja
        - label_en
        - total_xp
        - level
        - xp_to_next_level
      properties:
        category:
          $ref: "#/components/schemas/SkillCategory"
        label_ja:
          type: string
        label_en:
          type: string
        total_xp:
          type: integer
          minimum: 0
        level:
          type: integer
          minimum: 1
          description: floor(total_xp / 100) + 1
        xp_to_next_level:
          type: integer
          minimum: 1
          maximum: 100
          description: 100 - (total_xp % 100)

    SkillsSummaryResponse:
      type: object
      required:
        - categories
        - total_xp
        - overall_level
        - streak_days
        - weekly_mastered_count
      properties:
        categories:
          type: array
          minItems: 6
          maxItems: 6
          items:
            $ref: "#/components/schemas/CategorySkillSummary"
        total_xp:
          type: integer
          minimum: 0
        overall_level:
          type: integer
          minimum: 1
        streak_days:
          type: integer
          minimum: 0
        weekly_mastered_count:
          type: integer
          minimum: 0
          description: 直近7日間に思考問題クリアまたは復習 grade >= 3 を達成した件数（PRD L146 の誤記 `weekly_ mastered_count` を正規化したフィールド名）

    TestResetResponse:
