  /api/v1/challenges/{challenge_id}/submit:
    post:
      operationId: submitChallenge
      tags:
        - challenges
      summary: 実践思考問題への記述回答と3観点ルーブリック自己検証によるXP加算
      description: |
        対応受け入れ条件：AC-3, AC-7
        認証：不要

        回答テキスト（`answer`：10文字以上2,000文字以下）と、3つの評価観点のうち自己検証で満たした項目数
        （`matched_rubric_count`：`0`〜`3`）を受け取り、1秒（1,000ms）以内に以下を更新して HTTP 200 を返す：
        - 状態 `status` を `"completed"` に更新
        - 獲得XP `earned_xp = 20 + matched_rubric_count * 10`（`20`, `30`, `40`, `50` のいずれか）を該当スキル領域に加算
        - 更新後の領域 `total_xp` と `level`（`floor(total_xp / 100) + 1`）を算出
        - 当日初回の学習完了（思考問題回答またはカード復習）である場合、`streak_days` を `+1` 更新
        - 3つの評価観点に対応する模範解説 `model_points`（3件の配列）を返却

        ### 送り直しと解答済みの問題（AC-3 / AC-7、2026-10-30 追補）
        - 同じ `Idempotency-Key` で同じ要求を送り直したときは、`createLearning` の「Idempotency-Key で送り直したとき」と同じ決まりで、
          1回目と同じ 200 と同じ本文を返し、`Idempotent-Replayed: true` を付ける。XP と連続日数は1回分だけ。本文が違えば 422（`IDEMPOTENCY_KEY_MISMATCH`）。
        - キーなし、または別のキーで、すでに `completed` の問題に送ったときは、何も変えずに 409（`CHALLENGE_ALREADY_COMPLETED`、`field: "challenge_id"`）。
        - 調べる順序：キーの形（400）→ 同じキーの送り直し（200 の再生 / 422）→ 問題があるか（404）→ 本文の検査（400）→ 解答済みか（409）。
        - `answer` の数え方は `createLearning` の `memo` と同じ（コードポイントで数え、2,000 以下、かつ前後の空白を除いて10以上。空白だけは 400、`field: "answer"`）。

        ### 連続日数 streak_days の更新（AC-3 / AC-4、2026-10-30 追補。gradeReviewCard も同じ）
        - 「日」は基準時刻（`X-Test-Now` か、サーバーの現在時刻）の UTC の暦日。`last_study_date` も UTC の日付。
        - 完了したとき：`last_study_date` が今日か今日より後なら変えない。昨日なら `+1`。2日以上前か `null`（まだ学習していない）なら `1` に戻す。
        - `last_study_date` が今日より前だったときは、今日に更新する。
      security: []
      parameters:
        - name: challenge_id
          in: path
          required: true
          description: 回答対象の実践思考問題ID
          schema:
            type: string
            example: chl_01J8X001
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - $ref: "#/components/parameters/TestNowHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitChallengeRequest"
            examples:
              validSubmission:
                summary: AC-3 思考問題回答（3観点すべて達成）
                value:
                  answer: 秒間1万リクエストの参照系APIを前提とし、単純なロック方式は待機スレッド枯渇の懸念があるためTTLジッターと非同期再計算を併用する。Redis障害時はサーキットブレーカーでDB直読みを制限する。
                  matched_rubric_count: 3
                  elapsed_seconds: 50
      responses:
        "200":
          description: 実践思考問題の回答完了とXP加算結果（AC-3）
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitChallengeResponse"
              examples:
                completedChallenge:
                  summary: AC-3 回答完了レスポンス（+50 XP）
                  value:
                    challenge_id: chl_01J8X001
                    status: completed
                    category: data
                    answer: 秒間1万リクエストの参照系APIを前提とし、単純なロック方式は待機スレッド枯渇の懸念があるためTTLジッターと非同期再計算を併用する。Redis障害時はサーキットブレーカーでDB直読みを制限する。
                    matched_rubric_count: 3
                    earned_xp: 50
                    total_xp: 65
                    level: 1
                    streak_days: 1
                    model_points:
                      - "前提・制約：想定QPS、許容レイテンシ、データの鮮度要件（結果整合性でよいか）を明示する"
                      - "トレードオフ：ミューテックスロック（一貫性高・待ち発生）とTTLジッター/論理期限切れ（スループット高・実装複雑）を比較する"
                      - "障害・エッジケース：キャッシュ層全損時のDB保護（レート制限・フォールバック応答・コールドスタート対策）を備える"
                    completed_at: "2026-10-30T09:02:00Z"
        "400":
          description: 回答文字数不足・超過またはルーブリック数の範囲外エラー（AC-7）
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                invalidAnswerLength:
                  summary: AC-7 answer文字数不足エラー
                  value:
                    type: https://devforge.local/problems/validation-error
                    title: 入力内容に誤りがあります
                    status: 400
                    detail: answer は10文字以上2000文字以下で入力してください
                    instance: /api/v1/challenges/chl_01J8X001/submit
                    error:
                      code: VALIDATION_ERROR
                      message: answer は10文字以上2000文字以下で入力してください
