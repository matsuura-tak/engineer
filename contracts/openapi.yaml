            - RESOURCE_NOT_FOUND
            - TEST_SEAM_DISABLED
            - INTERNAL_ERROR
            - CHALLENGE_ALREADY_COMPLETED
            - REVIEW_CARD_NOT_DUE
            - IDEMPOTENCY_KEY_MISMATCH
        message:
          type: string
        field:
          type:
            - string
            - "null"

    ProblemDetails:
      type: object
