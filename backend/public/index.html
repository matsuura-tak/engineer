<!doctype html>
<html lang="ja" data-state="loading" data-build-version="{{BUILD_VERSION}}">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; require-trusted-types-for 'script'; trusted-types kyounoitte-sw">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{APP_NAME}}</title>
<meta name="apple-mobile-web-app-title" content="{{APP_NAME}}">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./app.css">
<link rel="modulepreload" href="./js/main.js">
<link rel="modulepreload" href="./js/dom.js">
<link rel="modulepreload" href="./js/dates.js">
<link rel="modulepreload" href="./js/i18n.js">
<link rel="modulepreload" href="./js/validate.js">
<link rel="modulepreload" href="./js/store.js">
<link rel="modulepreload" href="./js/rules.js">
<link rel="modulepreload" href="./js/files.js">
<link rel="modulepreload" href="./js/view-start.js">
<link rel="modulepreload" href="./js/view-task.js">
<link rel="modulepreload" href="./js/view-settings.js">
<link rel="preload" as="fetch" crossorigin href="./data/tasks.json">
<link rel="preload" as="fetch" crossorigin href="./i18n/ja.json">
<link rel="preload" as="fetch" crossorigin href="./i18n/en.json">
<script type="module" src="./js/main.js"></script>
</head>
<body>
<header class="site-header">
<a class="link app-name" href="./" data-testid="app.name">{{APP_NAME}}</a>
<nav></nav>
</header>
<main>
<p class="loading" data-testid="app.loading">{{APP_LOADING}}</p>
<noscript><p data-testid="app.noscript">{{APP_NOSCRIPT}}</p></noscript>
</main>
</body>
</html>
